[package]
name = "serial_tool"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
chrono = "0.4"
base64 = "0.22"
if-addrs = "0.15.0"
rfd = "0.18.0"

[profile.release]
opt-level = 2
strip = true
lto = false
codegen-units = 16
incremental = true
